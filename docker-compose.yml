services:
  db:
    image: mysql:8.0
    container_name: landlease-db
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-landlease_root_pwd}
      MYSQL_DATABASE: ${DB_NAME:-landlease}
      TZ: Asia/Shanghai
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-landlease_root_pwd}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: landlease-backend
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    volumes:
      - ./storage:/app/storage          # 原件与通知书持久化
      - ./国有土地租赁模拟样本包_练习集:/app/国有土地租赁模拟样本包_练习集:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: landlease-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
